[api]
enabled = true
port = 54321

[db]
port = 54322

# O db reset carrega as bases e depois as contas fictícias dos testes.
[db.seed]
enabled = true
sql_paths = ["./seed/001_exercicios.sql", "./seed/002_alimentos.sql", "./seed.sql"]

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# Senha mínima de 8 com letras e números; e-mail confirmado antes do login.
minimum_password_length = 8
password_requirements = "letters_digits"

[auth.email]
enable_confirmations = true

[auth.external.google]
enabled = false

[auth.external.apple]
enabled = false
